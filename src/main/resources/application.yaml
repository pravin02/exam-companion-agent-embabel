spring:
  application:
    name: exam_companion_agent_embabel
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: false
server:
  port: 8080

logging:
  pattern:
    console: '%clr(%d{HH:mm:ss.SSS}){faint} %clr([%t]){magenta} %clr(%-5level) %clr(%logger{0}){cyan} %clr(-){faint} %msg%n'
  level:
    com.embabel.agent.core.ActionRunner: DEBUG
    com.embabel.agent.config.models.DockerLocalModels: DEBUG
    com.embabel.agent.web.sse.SSEController: INFO
    com.embabel.agent.tools.mcp: DEBUG

# Observability configuration for Embabel to see GOAP, Tool Loop and Spring AI traces in your observability platform
embabel:
  agent:
    platform:
      tools:
        lazy-init: true
  observability:
    enabled: true
    service-name: exam-companion

# Observability configuration for spring AI with tracing and logging
---
spring:
  ai:
    chat:
      client:
        observations:
          log-prompt: false # enable ChatClient prompt logging
      observations:
        log-prompt: false # enable CHatModel prompt logging
        log-completion: false # enable ChatModel response logging
        include-error-logging: true # include error details

  # Observation and tracing configuration
  management:
    tracing:
      enabled: true
      sampling:
        probability: 1.0 # Sample 100% of thr traces (use 0.1 for production)
    #Zipkin configuration
    zipkin:
      tracing:
        endpoint: http://localhost:9411/api/spans
